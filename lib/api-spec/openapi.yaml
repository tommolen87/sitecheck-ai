openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scans
    description: Website scan operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scans:
    post:
      operationId: createScan
      tags: [scans]
      summary: Start a website scan
      description: Fetches the public homepage and creates a first analysis from the information that can actually be checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "201":
          description: Scan completed or marked as unable to complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Invalid website URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listScans
      tags: [scans]
      summary: List recent website scans
      description: Returns the most recent scan requests and any available first analysis.
      responses:
        "200":
          description: Recent scan requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
  /scans/{scanId}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get a website scan result
      description: Returns the current lifecycle status and any available first analysis.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Scan request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScanInput:
      type: object
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          description: Website URL to scan
      required:
        - url
    Scan:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [analyzing, completed, failed]
        createdAt:
          type: string
          format: date-time
        analysis:
          oneOf:
            - $ref: "#/components/schemas/ScanAnalysis"
            - type: "null"
        error:
          type: ["string", "null"]
      required:
        - id
        - url
        - status
        - createdAt
        - analysis
        - error
    ScanAnalysis:
      type: object
      properties:
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
        categoryScores:
          type: array
          items:
            $ref: "#/components/schemas/CategoryScore"
        detectedFacts:
          $ref: "#/components/schemas/DetectedFacts"
        notChecked:
          type: array
          items:
            type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ScanIssue"
      required:
        - overallScore
        - categoryScores
        - detectedFacts
        - notChecked
        - issues
    CategoryScore:
      type: object
      properties:
        key:
          type: string
          enum: [conversie, seo, mobiel, techniek, content, vertrouwen, lokaal]
        label:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        checked:
          type: boolean
        note:
          type: string
      required:
        - key
        - label
        - score
        - checked
        - note
    DetectedFacts:
      type: object
      properties:
        pageTitle:
          type: ["string", "null"]
        metaDescription:
          type: ["string", "null"]
        h1Count:
          type: integer
          minimum: 0
        headingCount:
          type: integer
          minimum: 0
        headings:
          type: array
          items:
            type: string
        visibleTextLength:
          type: integer
          minimum: 0
        linkCount:
          type: integer
          minimum: 0
        imageCount:
          type: integer
          minimum: 0
        imagesWithAlt:
          type: integer
          minimum: 0
        ctaCount:
          type: integer
          minimum: 0
        callsToAction:
          type: array
          items:
            type: string
        contactSignals:
          type: array
          items:
            type: string
        technicalSignals:
          type: array
          items:
            type: string
        responseTimeMs:
          type: integer
          minimum: 0
        pageSizeKb:
          type: number
          minimum: 0
        https:
          type: boolean
      required:
        - pageTitle
        - metaDescription
        - h1Count
        - headingCount
        - headings
        - visibleTextLength
        - linkCount
        - imageCount
        - imagesWithAlt
        - ctaCount
        - callsToAction
        - contactSignals
        - technicalSignals
        - responseTimeMs
        - pageSizeKb
        - https
    ScanIssue:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        severity:
          type: string
          enum: [high, medium, low]
        fact:
          type: string
        recommendation:
          type: string
      required:
        - id
        - title
        - severity
        - fact
        - recommendation
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

